name: False positive
description: A legit player gets flagged, set back or punished
title: "[False positive] "
labels: [false-positive, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more of these you fill in, the faster it gets fixed.
        Run `/ac logs <player>` and paste the rows for the flag below.
  - type: dropdown
    id: check
    attributes:
      label: Check
      options: [Aim, AutoClicker, AutoCrystal, AutoFish, Backtrack, BadPackets, BoatFly, Criticals, ElytraFly, FastBreak, FastClimb, FastPlace, FastUse, Fly, HitBox, Interact, Inventory, Jesus, KeepSprint, KillAura, NoFall, NoRotate, NoSlow, Nuker, PacketOrder, Phase, Reach, Scaffold, Simulation, Speed, Sprint, SuperKnockback, Timer, Velocity, XCarry, Not sure]
    validations:
      required: true
  - type: textarea
    id: alert
    attributes:
      label: Alert or /ac logs output
      description: Copy the alert(s) from chat or the console, including the details in brackets.
      render: text
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What was the player doing?
      description: E.g. sprint-jumping on ice, getting hit by a wind charge, riding a boat, using a launch pad.
    validations:
      required: true
  - type: dropdown
    id: often
    attributes:
      label: How often does it happen?
      options: [Every time, Often, Rarely, Once]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Player ping and client
      placeholder: 120 ms, Java 1.21.4 (or Bedrock via Geyser, Lunar, Fabric with mods...)
  - type: textarea
    id: plugins
    attributes:
      label: Other plugins that move players or change combat
      description: Launch pads, grappling hooks, custom knockback, vehicles, minigames, WorldGuard flags...
  - type: dropdown
    id: software
    attributes:
      label: Server software
      options: [Paper, Purpur, Spigot, Other Paper fork, Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: MDAntiCheat, server and PacketEvents versions.
      placeholder: MDAntiCheat 2.0.0, Paper 1.21.4-232, PacketEvents 2.14.0
    validations:
      required: true
