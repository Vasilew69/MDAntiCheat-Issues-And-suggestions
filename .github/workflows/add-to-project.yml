name: Add to project

# Puts new issues on the Blocksmith project board, next to the plugin's own issues.
# Run it manually (Actions → Add to project → Run workflow) to add every open issue.
#
# Needs a repository secret PROJECT_TOKEN: a classic personal access token with the
# `project` and `repo` scopes (GitHub's built-in token can't access personal projects).
# The board defaults to https://github.com/users/Vasilew69/projects/1; if yours has a
# different number, set a repository variable PROJECT_URL to its address.

on:
  issues:
    types: [opened, reopened, transferred]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      # Until the secret is added, skip with a warning instead of failing every run.
      - name: Check for PROJECT_TOKEN
        if: env.PROJECT_TOKEN == ''
        run: echo "::warning::PROJECT_TOKEN secret is not set, so nothing was added to the project. See the comment at the top of .github/workflows/add-to-project.yml."
      - uses: actions/github-script@v7
        if: env.PROJECT_TOKEN != ''
        env:
          PROJECT_URL: ${{ vars.PROJECT_URL || 'https://github.com/users/Vasilew69/projects/1' }}
        with:
          github-token: ${{ env.PROJECT_TOKEN }}
          script: |
            const match = process.env.PROJECT_URL.match(/github\.com\/(users|orgs)\/([^/]+)\/projects\/(\d+)/);
            if (!match) {
              core.setFailed(`PROJECT_URL "${process.env.PROJECT_URL}" is not a project address`);
              return;
            }
            const ownerType = match[1] === 'users' ? 'user' : 'organization';
            const found = await github.graphql(
              `query($login: String!, $number: Int!) { ${ownerType}(login: $login) { projectV2(number: $number) { id title } } }`,
              { login: match[2], number: Number(match[3]) }
            );
            const project = found[ownerType]?.projectV2;
            if (!project) {
              core.setFailed(`No project at ${process.env.PROJECT_URL}`);
              return;
            }

            let items;
            if (context.eventName === 'workflow_dispatch') {
              // Open issues (the issues API also lists pull requests; skip those).
              items = (await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
              })).filter((i) => !i.pull_request);
            } else {
              items = [context.payload.issue];
            }

            for (const item of items) {
              // Adding an item that is already on the board is a no-op.
              await github.graphql(
                `mutation($project: ID!, $content: ID!) {
                   addProjectV2ItemById(input: { projectId: $project, contentId: $content }) { item { id } }
                 }`,
                { project: project.id, content: item.node_id }
              );
              core.info(`Added #${item.number} ${item.title} to ${project.title}`);
            }
